{{- if and .Values.rbac.create (not .Values.watchNamespaces) }}
# Cluster-scoped reads for PhysicalHostPool claims, cluster-wide install only;
# mirrors config/rbac/host_pool_role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "beskar7.fullname" . }}-host-pool-role
  labels:
    {{- include "beskar7.labels" . | nindent 4 }}
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools/finalizers
  verbs:
  - update
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "beskar7.fullname" . }}-host-pool-rolebinding
  labels:
    {{- include "beskar7.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "beskar7.fullname" . }}-host-pool-role
subjects:
- kind: ServiceAccount
  name: {{ include "beskar7.serviceAccountName" . }}
  namespace: {{ include "beskar7.namespace" . }}
{{- end }}
