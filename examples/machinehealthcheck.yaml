---
# Recommended MachineHealthCheck for a Beskar7-provisioned pool.
#
# Beskar7 deliberately owns no provisioning-retry loop: a bare-metal reprovision
# overwrites the whole disk, so it must be an explicit remediation decision rather
# than an automatic controller loop (see docs/inspector-contract.md §12). Attempt
# limiting and remediation therefore live here, in CAPI, where they can see the
# whole fleet.
#
# This object covers two distinct failures:
#
#   1. "Provisioned but never joined" — beskar7 wrote the disk and reported
#      success, but no Node ever registered. nodeStartupTimeout catches it.
#      The usual cause is a ProviderID mismatch rather than a slow boot; check
#      docs/troubleshooting.md before raising the timeout.
#
#   2. A Node that joined and later went unhealthy — the standard Ready=False /
#      Unknown conditions below.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: beskar7-pool-health
  namespace: default
spec:
  clusterName: my-cluster

  # Scope this check to the machines you want remediated. Narrow it deliberately:
  # a selector that also matches control-plane machines will let CAPI delete them.
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: my-worker-pool

  # How long CAPI waits, from "infrastructure provisioned", for a Node carrying
  # the matching ProviderID to appear. 15m is the recommended starting value
  # (docs/inspector-contract.md §13): a Kairos host reboots via firmware,
  # auto-installs on first boot, then the kubelet registers — ~2-3 minutes
  # observed on real hardware. The rest is margin for slow POST, large-disk
  # expansion, and a control plane that is slow to admit.
  nodeStartupTimeout: 15m

  # Remediate only while most of the pool is healthy. Without this, a
  # provisioning-wide fault (bad image digest, unreachable boot server) would
  # cause CAPI to delete and re-provision every machine in a loop — each one a
  # destructive whole-disk write.
  maxUnhealthy: 40%

  unhealthyConditions:
    - type: Ready
      status: Unknown
      timeout: 5m
    - type: Ready
      status: "False"
      timeout: 5m
