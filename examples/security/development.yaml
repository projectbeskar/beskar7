# Development-style security configuration for Beskar7.
#
# Loosens TLS verification for self-signed BMC certs typical in lab setups.
# Do NOT use this configuration in production.
#
# See docs/security/configuration.md for the production equivalent.

---
apiVersion: v1
kind: Namespace
metadata:
  name: beskar7-dev

---
# Throwaway BMC credentials for a lab. Generate a real password externally.
#
# The annotations bind the credentials to their BMCs (D-030): they are sent
# only to hosts listed in bmc-addresses (IPs, CIDRs, hostnames or *.suffix
# entries, matched without DNS), and, because the host below skips TLS
# verification, only with bmc-insecure-transport set as well. Without them
# the host reports CredentialsNotAuthorized and its BMC is never contacted.
apiVersion: v1
kind: Secret
metadata:
  name: bmc-credentials
  namespace: beskar7-dev
  annotations:
    beskar7.infrastructure.cluster.x-k8s.io/bmc-addresses: "192.168.1.100"
    beskar7.infrastructure.cluster.x-k8s.io/bmc-insecure-transport: "true"   # Development only.
type: Opaque
stringData:
  username: "admin"
  password: "changeme"

---
# Lab PhysicalHost: skip TLS verification because the BMC has a self-signed
# cert. NEVER do this in production — use caBundleSecretRef instead.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: PhysicalHost
metadata:
  name: dev-server-01
  namespace: beskar7-dev
spec:
  redfishConnection:
    address: "https://192.168.1.100"
    credentialsSecretRef: "bmc-credentials"
    insecureSkipVerify: true       # Development only — accepts any BMC cert.

---
# Helm values for a development install. Apply with:
#   helm install beskar7 beskar7/beskar7 -n capb7-system --create-namespace -f values-dev.yaml
#
# values-dev.yaml:
#
#   webhook:
#     enabled: false              # skip the Beskar7Cluster webhook in dev
#   certManager:
#     enabled: true               # callback endpoint still needs serving certs
#   # Hosts reach the callback server while PXE-booting, before they are on the
#   # cluster network, so a cluster-internal .svc name does not work for them.
#   # Expose the callback Service and name that address here; the serving
#   # certificate must cover it.
#   callback:
#     service:
#       type: NodePort
#     externalIPs: ["192.0.2.10"]       # an address hosts can reach
#   bootstrap:
#     urlBase: "https://192.0.2.10:8082"
#
# The chart has no value for extra manager flags. For development-style logs
# (console encoder, stack traces from Warn), add --zap-devel=true to the
# manager container's args after installing.
