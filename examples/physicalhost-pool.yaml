# Shared hosts: a PhysicalHostPool lets clusters in other namespaces claim
# hosts that stay, with their BMC credentials, in an admin namespace.
#
# Needs the cluster-wide install (no --watch-namespaces). See
# docs/physicalhostpool.md.
#
# Admin side: the pool, the host and its BMC Secret. The host joins the pool
# with one label per pool; it must be wiped on release (cleaningMode Metadata)
# because the next claim can come from another namespace.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: PhysicalHostPool
metadata:
  name: default
spec:
  hostNamespaces:
  - beskar7-hosts             # members only from here
  namespaceSelector: {}        # every namespace may claim; required, {} is the explicit "everyone"
---
apiVersion: v1
kind: Secret
metadata:
  name: node-07-bmc
  namespace: beskar7-hosts
  annotations:
    beskar7.infrastructure.cluster.x-k8s.io/bmc-addresses: "<bmc-address>"
type: Opaque
stringData:
  username: "<bmc-username>"
  password: "<bmc-password>"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: PhysicalHost
metadata:
  name: node-07
  namespace: beskar7-hosts
  labels:
    pool.beskar7.infrastructure.cluster.x-k8s.io/default: ""
spec:
  cleaningMode: Metadata
  redfishConnection:
    address: "https://<bmc-address>"
    credentialsSecretRef: node-07-bmc
---
# Cluster owner side: only the poolRef line is new. No PhysicalHost and no BMC
# Secret in this namespace.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Beskar7MachineTemplate
metadata:
  name: workers
  namespace: team-a
spec:
  template:
    spec:
      poolRef: default
      inspectionImageURL: "https://<boot-server>/inspector"
      targetImageURL: "http://<image-server>/kairos-<distro>-<version>.raw"
      targetImageDigest: "sha256:<sha256-of-the-image>"
