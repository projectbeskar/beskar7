apiVersion: apps/v1
kind: Deployment
metadata:
  name: capb7-controller-manager
  namespace: capb7-system
spec:
  template:
    spec:
      volumes:
      - name: webhook-server-cert
        secret:
          secretName: capb7-webhook-server-cert
      containers:
      - name: manager
        volumeMounts:
        - name: webhook-server-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true 