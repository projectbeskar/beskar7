apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# manifests.yaml is generated by `make manifests` (controller-gen webhook) from
# the +kubebuilder:webhook markers in api/*/webhooks — do not hand-edit it.
resources:
- manifests.yaml
- service.yaml

namespace: capb7-system

patches:
- path: patches/cainjection_in_webhooks.yaml
- path: patches/cainjection_in_webhook_configurations.yaml
