apiVersion: apps/v1
kind: Deployment
metadata:
  # Same name as the Helm chart's Deployment so docs, diagnostics and the
  # smoke runner (OPERATOR_DEPLOY) work for both install paths.
  name: beskar7-controller-manager
  namespace: capb7-system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls: []
      volumes:
      - name: webhook-server-cert
        secret:
          secretName: beskar7-webhook-server-cert
          defaultMode: 0400
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        - --enable-webhook=true
        - --metrics-bind-address=:8443
        - --health-probe-bind-address=:8081
        # clusterctl variable (drone/envsubst syntax): `clusterctl init` resolves
        # BESKAR7_BOOTSTRAP_URL_BASE from the environment or its config file and
        # falls back to the in-cluster callback Service. `make release-manifests`
        # and `make deploy` resolve the default for plain kubectl consumers.
        - --bootstrap-url-base=${BESKAR7_BOOTSTRAP_URL_BASE:=https://beskar7-controller-manager.capb7-system.svc:8082}
        image: controller
        # The tag is pinned per release; IfNotPresent also lets a locally loaded
        # image (kind, clusterctl local repository) run without a registry.
        imagePullPolicy: IfNotPresent
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
              - "ALL"
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: GODEBUG
          value: "netdns=go"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        volumeMounts:
        - name: webhook-server-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        - name: tmp
          mountPath: /tmp
          readOnly: false
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: healthz
          protocol: TCP
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 8082
          name: callback
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 2Gi
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 100Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: true
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      priorityClassName: system-cluster-critical 