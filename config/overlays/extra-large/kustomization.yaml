apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See ../small/kustomization.yaml for what a size overlay may change.
namespace: capb7-system

resources:
- ../../default
- pdb.yaml

patches:
- path: manager_patch.yaml
# Appended to config/default's args: a strategic-merge patch replaces the whole
# list, which would drop --bootstrap-url-base and --enable-webhook.
- target:
    kind: Deployment
    name: capb7-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --leader-elect-lease-duration=20s
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --leader-elect-renew-deadline=15s
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --leader-elect-retry-period=3s

labels:
- pairs:
    deployment-size: extra-large
  includeSelectors: false
