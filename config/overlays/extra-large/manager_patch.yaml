apiVersion: apps/v1
kind: Deployment
metadata:
  name: capb7-controller-manager
  namespace: capb7-system
spec:
  replicas: 5
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 4Gi
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 200Mi
      # One replica per node (so the pool needs at least five schedulable
      # nodes), spread across zones where the nodes allow it.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                control-plane: controller-manager
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  control-plane: controller-manager
              topologyKey: topology.kubernetes.io/zone
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
