apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A size overlay resizes config/default and changes nothing else
# (test/contract/overlays_test.go): no namePrefix, because the cert-manager
# Certificate names the webhook and callback Services literally; no images
# entry, because the release stamps config/default; manager flags appended,
# never a replacement args list.
namespace: capb7-system

resources:
- ../../default

patches:
- path: manager_patch.yaml

# Metadata only: in a selector it would change the Deployment's immutable
# spec.selector, so moving an install from one size to another would fail.
labels:
- pairs:
    deployment-size: small
  includeSelectors: false
