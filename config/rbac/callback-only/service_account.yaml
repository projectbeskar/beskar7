# The identity a callback-only manager (--controllers=none) runs as. Its own
# ServiceAccount, never the manager's: the manager's holds cluster-wide Secret
# create/update/delete, and this one runs outside the cluster on the
# provisioning network. watched-namespace/ binds its permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capb7-callback
  namespace: capb7-system
