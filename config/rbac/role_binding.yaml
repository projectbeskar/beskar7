apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capb7-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capb7-manager-role # Must match ClusterRole name
subjects:
- kind: ServiceAccount
  name: capb7-manager # Must match ServiceAccount name
  namespace: capb7-system # Must match the namespace 