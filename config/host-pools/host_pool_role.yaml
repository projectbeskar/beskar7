# Cluster-scoped access for PhysicalHostPool claims (--enable-host-pools), in the
# cluster-wide and the namespace-scoped install alike: pools and namespaces are
# cluster-scoped, so a per-namespace Role cannot grant them. Hand-maintained, not
# generated: the pool code carries no +kubebuilder:rbac markers, so role.yaml,
# which the namespace-scoped watch Roles mirror, stays free of cluster-scoped rules.
# Helm: charts/beskar7/templates/rbac-host-pools.yaml (hostPools.enabled).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capb7-host-pool-role
rules:
# Pools: read on every claim and callback, finalizer on create and delete.
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools/finalizers
  verbs:
  - update
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - physicalhostpools/status
  verbs:
  - get
  - patch
  - update
# Namespaces: a pool's namespaceSelector matches namespace labels.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capb7-host-pool-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capb7-host-pool-role
subjects:
- kind: ServiceAccount
  name: capb7-manager
  namespace: capb7-system
