# Adds namespace to all resources.
namespace: capb7-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "controller-manager" becomes "my-deployment-controller-manager".
# namePrefix: my-deployment-

# Two groups on purpose — the split is load-bearing, do not merge them.
#
# Identity labels go into selectors. They must be STABLE for the lifetime of a
# deployment, because Deployment.spec.selector is immutable and a Service
# selector silently stops matching its pods when it drifts.
#
# The version label must NOT go into selectors. `make release-manifests` rewrites
# it on every release, so with includeSelectors: true the Deployment selector
# changed every version and `kubectl apply -f beskar7-manifests-<new>.yaml` — the
# documented upgrade path — failed outright with:
#
#   spec.selector: Invalid value: {...}: field is immutable
#
# and the webhook Service selector stopped matching the pods, leaving it with no
# endpoints so failurePolicy: Fail blocked all Beskar7Cluster admission.
labels:
- pairs:
    app.kubernetes.io/name: beskar7
  includeSelectors: true
- pairs:
    app.kubernetes.io/version: v0.2.7
  includeSelectors: false
# clusterctl's component labels, applied to every object the way `clusterctl
# init` would (addCommonLabels in cluster-api's
# cmd/clusterctl/client/repository/components.go). `clusterctl move` discovers
# only CRDs carrying clusterctl.cluster.x-k8s.io, and the provider contract asks
# for cluster.x-k8s.io/provider on every component. The CRDs already carry both
# from their controller-gen markers; this group keeps the rest of the release
# manifest consistent. Metadata only — never in selectors, see above.
- pairs:
    clusterctl.cluster.x-k8s.io: ""
    cluster.x-k8s.io/provider: infrastructure-beskar7
  includeSelectors: false

resources:
- ../crd
- ../rbac
- ../manager
- ../security
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- ../webhook
# [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER'. 'WEBHOOK' components are required.
- ../certmanager

# Mount the controller config file for loading manager configurations
# through a ComponentConfig type
#- manager_config_patch.yaml

# Images for the Beskar7 manager. The image name `controller` must match
# the name used in config/manager/manager.yaml.
images:
- name: controller
  newName: ghcr.io/projectbeskar/beskar7/beskar7
  newTag: v0.2.7

# Replace VERSION placeholder with actual version
replacements:
- source:
    kind: Namespace
    name: capb7-system
    fieldPath: metadata.labels.[app.kubernetes.io/version]
  targets:
  - select:
      kind: .*
    fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]