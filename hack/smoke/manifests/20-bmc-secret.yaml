# Credentials the controller will use to authenticate against the mock BMC.
# These MUST match the --username / --password flags on mock-redfish above.
#
# The annotations say where the controller may send these credentials (D-030);
# without them it refuses with RedfishConnectionReady=False/CredentialsNotAuthorized
# and never contacts the BMC. bmc-addresses lists the host of every
# PhysicalHost address that names this Secret: the layer-3 mock
# (30-physicalhost.yaml, 61-pool.yaml) and the layer-7 one (61-pool.yaml).
# Every smoke host sets insecureSkipVerify (the mocks generate self-signed
# certificates), which also needs bmc-insecure-transport.
apiVersion: v1
kind: Secret
metadata:
  name: bmc-credentials
  namespace: beskar7-smoke
  labels:
    app.kubernetes.io/part-of: beskar7
    app.kubernetes.io/component: smoke-test
  annotations:
    beskar7.infrastructure.cluster.x-k8s.io/bmc-addresses: "mock-redfish.beskar7-smoke.svc, mock-redfish-b.beskar7-smoke.svc"
    beskar7.infrastructure.cluster.x-k8s.io/bmc-insecure-transport: "true"
type: Opaque
stringData:
  username: admin
  password: password123
