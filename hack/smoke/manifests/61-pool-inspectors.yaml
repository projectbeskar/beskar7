---
# Layer 7 helper: one mock-inspector Job per pool host.
#
# These are explicit rather than generated by transforming
# 50-mock-inspector-job.yaml — stripping documents out of that file with sed/awk
# left orphan YAML fragments, and a fixture that a reader can diff against the
# single-host Job is worth more than the duplication it costs.
#
# The ServiceAccount/Role/RoleBinding from 50-mock-inspector-job.yaml are reused
# as-is: that Role is namespace-scoped (get on physicalhosts + secrets in
# beskar7-smoke), so it already covers the pool hosts without extra grants.
apiVersion: batch/v1
kind: Job
metadata:
  name: mock-inspector-pool-host-a
  namespace: beskar7-smoke
  labels:
    app.kubernetes.io/name: mock-inspector
    app.kubernetes.io/part-of: beskar7
    app.kubernetes.io/component: smoke-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-inspector
        app.kubernetes.io/part-of: beskar7
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      serviceAccountName: mock-inspector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mock-inspector
        image: ghcr.io/projectbeskar/beskar7/mock-inspector:v0.4.0-alpha.3
        imagePullPolicy: IfNotPresent
        args:
        - --namespace=beskar7-smoke
        - --host-name=pool-host-a
        - --wait-for-bootstrap=3m
        - --insecure-skip-verify=true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
