name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/beskar7

jobs:
  # Job 1: Build and Push Container Images
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-url: ${{ steps.build.outputs.image-url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          
    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false
        
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom.spdx.json
        
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign controller image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

    # Bind the SBOM to the image as a signed, verifiable attestation rather than
    # leaving it as a loose release artifact. Verify with:
    #   cosign verify-attestation --type spdxjson $IMAGE ...
    - name: Attest SBOM to the image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
        echo "attested SBOM to ${image}@${DIGEST}"

  # Job 2: Build and Push Mock Redfish Image (parallel with build-and-push)
  build-and-push-mock-redfish:
    name: Build and Push Mock Redfish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ github.repository }}/mock-redfish
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push mock-redfish image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.mock-redfish
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign mock-redfish image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

  # Job 3: Build and Push Mock Inspector Image (parallel with build-and-push and build-and-push-mock-redfish)
  build-and-push-mock-inspector:
    name: Build and Push Mock Inspector Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ github.repository }}/mock-inspector
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push mock-inspector image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.mock-inspector
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign mock-inspector image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

  # Job 4: Security Scan Released Image
  security-scan:
    name: Security Scan Released Image
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    # OSV-Scanner runs as a container action without access to the Docker
    # daemon, so the released image is pulled and handed over as an archive.
    - name: Pull and export the released image
      run: |
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
        docker pull "${image}"
        docker save -o osv-image.tar "${image}"

    - name: Scan the released image with OSV-Scanner
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      continue-on-error: true # exits 1 on findings; the report is the deliverable
      with:
        scan-args: |-
          scan
          image
          --archive
          osv-image.tar
          --format=json
          --output=osv-image-results.json

    - name: Convert the scan to SARIF
      uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      with:
        scan-args: |-
          --new=osv-image-results.json
          --output=osv-image-results.sarif
          --gh-annotations=false
          --fail-on-vuln=false

    - name: Upload scan results to the Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: osv-image-results.sarif
        category: osv-scanner-release-image

    - name: Write the human-readable vulnerability report
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      continue-on-error: true
      with:
        scan-args: |-
          scan
          image
          --archive
          osv-image.tar
          --format=table
          --output=osv-scanner-report.txt

    - name: Upload vulnerability report
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-report
        path: osv-scanner-report.txt

  # Job 5: Generate Release Artifacts
  generate-artifacts:
    name: Generate Release Artifacts  
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        
    - name: Install dependencies
      run: |
        go mod download
        make install-controller-gen
        
    - name: Install kustomize
      # Pinned via `go install` because the upstream `install_kustomize.sh`
      # at kustomize-master changed its asset-glob and started failing with
      # `tar: ./kustomize_v*_linux_amd64.tar.gz: Cannot open: No such file
      # or directory` (broke v0.4.0-alpha.5 release). Pinning here matches
      # the Go-install pattern already used for controller-gen and
      # golangci-lint in the Makefile, removes the dependency on a remote
      # shell script, and locks the version for reproducible release
      # manifests. Bump the version to track upstream when needed.
      run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3
        
    - name: Generate release manifests
      run: |
        export VERSION=${{ github.ref_name }}
        echo "Generating manifests for version: $VERSION"
        make release-manifests
        
    - name: Verify manifest generation
      run: |
        VERSION=${{ github.ref_name }}
        for f in "beskar7-manifests-$VERSION.yaml" infrastructure-components.yaml metadata.yaml; do
          if [ ! -f "$f" ]; then
            echo "❌ Release asset missing: $f"
            exit 1
          fi
        done
        # The kubectl manifest must have every clusterctl variable resolved; the
        # clusterctl components keep them (clusterctl init resolves them).
        if grep -q '\${' "beskar7-manifests-$VERSION.yaml"; then
          echo "❌ Unresolved clusterctl variables in the kubectl manifest:"
          grep '\${' "beskar7-manifests-$VERSION.yaml"
          exit 1
        fi
        echo "✅ Manifest file generated successfully: beskar7-manifests-$VERSION.yaml"
        echo "File size: $(stat -c%s "beskar7-manifests-$VERSION.yaml") bytes"
        echo "Checking for version placeholders..."
        if grep -q '${VERSION}' "beskar7-manifests-$VERSION.yaml"; then
          echo "❌ Found unresolved version placeholders in manifest:"
          grep '${VERSION}' "beskar7-manifests-$VERSION.yaml"
          exit 1
        fi
        echo "✅ No version placeholders found"
        
    - name: Generate checksums
      run: |
        sha256sum beskar7-manifests-${{ github.ref_name }}.yaml infrastructure-components.yaml metadata.yaml > checksums.txt
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          beskar7-manifests-${{ github.ref_name }}.yaml
          infrastructure-components.yaml
          metadata.yaml
          checksums.txt

  # Job 4: Create Helm Chart (TODO: Implement Helm chart)
  # helm-chart:
  #   name: Create and Publish Helm Chart
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Checkout repository
  #     uses: actions/checkout@v4
  #     
  #   - name: Install Helm
  #     uses: azure/setup-helm@v4
  #     with:
  #       version: '3.12.0'
  #       
  #   - name: Update chart version
  #     run: |
  #       VERSION=${{ github.ref_name }}
  #       # Remove 'v' prefix for Helm version
  #       CHART_VERSION=${VERSION#v}
  #       sed -i "s/^version:.*/version: $CHART_VERSION/" charts/beskar7/Chart.yaml
  #       sed -i "s/^appVersion:.*/appVersion: $VERSION/" charts/beskar7/Chart.yaml
  #       
  #   - name: Package Helm chart
  #     run: |
  #       helm package charts/beskar7 --destination ./charts/
  #       
  #   - name: Upload Helm chart
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: helm-chart
  #       path: charts/*.tgz

  # Job 6: Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, generate-artifacts]
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Generate release notes
      id: release-notes
      run: |
        # Extract version from tag
        VERSION=${{ github.ref_name }}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        # Start with the header
        echo "# Beskar7 $VERSION" > release-notes.md
        echo "" >> release-notes.md
        
        # Extract release notes from CHANGELOG.md if available
        if [ -f CHANGELOG.md ]; then
          echo "Extracting release notes from CHANGELOG.md for $VERSION"
          # Extract release notes for this version from CHANGELOG
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > changelog-section.md
          if [ -s changelog-section.md ]; then
            echo "Found changelog entry for $VERSION"
            # Add the changelog content (skip the version header line)
            tail -n +2 changelog-section.md >> release-notes.md
          else
            echo "No changelog entry found for $VERSION, using generic content"
            echo "## 🚀 What's New" >> release-notes.md
            echo "" >> release-notes.md
            echo "This release includes improvements and bug fixes for the Beskar7 Kubernetes operator." >> release-notes.md
          fi
        else
          echo "CHANGELOG.md not found, using generic content"
          echo "## 🚀 What's New" >> release-notes.md
          echo "" >> release-notes.md
          echo "This release includes improvements and bug fixes for the Beskar7 Kubernetes operator." >> release-notes.md
        fi
        
        # Add common installation and info sections
        echo "" >> release-notes.md
        echo "## 📦 Installation" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using clusterctl" >> release-notes.md
        echo "Add the provider to \`~/.cluster-api/clusterctl.yaml\` (until beskar7 is in clusterctl's built-in list):" >> release-notes.md
        echo "\`\`\`yaml" >> release-notes.md
        echo "providers:" >> release-notes.md
        echo "  - name: beskar7" >> release-notes.md
        echo "    type: InfrastructureProvider" >> release-notes.md
        echo "    url: https://github.com/projectbeskar/beskar7/releases/latest/infrastructure-components.yaml" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "clusterctl init --infrastructure beskar7:$VERSION" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using Kubectl" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "kubectl apply -f https://github.com/projectbeskar/beskar7/releases/download/$VERSION/beskar7-manifests-$VERSION.yaml" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using Helm" >> release-notes.md
        echo "Helm chart support is planned for a future release." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 📋 Prerequisites" >> release-notes.md
        echo "" >> release-notes.md
        echo "- Kubernetes 1.19+" >> release-notes.md
        echo "- cert-manager (required)" >> release-notes.md
        echo "- Cluster API v1.4.0+" >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🔒 Security" >> release-notes.md
        echo "" >> release-notes.md
        echo "This release includes security scanning and vulnerability assessment. See the attached vulnerability report for details." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🐳 Container Images" >> release-notes.md
        echo "" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "Available for:" >> release-notes.md
        echo "- linux/amd64" >> release-notes.md
        echo "" >> release-notes.md
        echo "> **Note**: ARM64 support temporarily disabled for releases due to build timeout issues. Will be re-enabled in a future release." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🔐 Verification" >> release-notes.md
        echo "" >> release-notes.md
        echo "All release artifacts are signed and include SBOMs for supply chain security." >> release-notes.md
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Beskar7 ${{ github.ref_name }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          release-artifacts/beskar7-manifests-${{ github.ref_name }}.yaml
          release-artifacts/infrastructure-components.yaml
          release-artifacts/metadata.yaml
          release-artifacts/checksums.txt
          sbom/sbom.spdx.json
          vulnerability-report/osv-scanner-report.txt
        token: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Update Documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !contains(github.ref_name, '-') }} # Only for stable releases
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update README with latest version
      run: |
        VERSION=${{ github.ref_name }}
        # Update installation examples: the release path and the manifest name
        # carry the version (the old pattern left `releases/download/<old>/` behind).
        sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?/beskar7-manifests-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\.yaml|releases/download/$VERSION/beskar7-manifests-$VERSION.yaml|g" README.md docs/installation.md
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md docs/installation.md
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "docs: update installation examples to ${{ github.ref_name }}"
          git push
        fi

  # Job 8: Notify on Success/Failure
  notify:
    name: Notify Release Status
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, generate-artifacts, release, update-docs]
    if: always()
    steps:
    - name: Notify success
      if: ${{ needs.release.result == 'success' }}
      run: |
        echo "✅ Release ${{ github.ref_name }} created successfully!"
        echo "🐳 Container image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
        echo "Release URL: https://github.com/projectbeskar/beskar7/releases/tag/${{ github.ref_name }}"
        
    - name: Notify failure
      if: ${{ needs.release.result == 'failure' }}
      run: |
        echo "❌ Release ${{ github.ref_name }} failed!"
        echo "Please check the workflow logs for details."
        exit 1 