name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/manager
  # build-push-action v6+ uploads a .dockerbuild build record per build as an
  # artifact; v5 did not. Keep the artifact list as it was.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Job 1: Build and Push Container Images
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-url: ${{ steps.build.outputs.image-url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          
    - name: Build and push container image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false
        
    - name: Generate SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        format: spdx-json
        output-file: sbom.spdx.json
        
    - name: Upload SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: sbom.spdx.json

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign controller image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

    # Bind the SBOM to the image as a signed, verifiable attestation rather than
    # leaving it as a loose release artifact. Verify with:
    #   cosign verify-attestation --type spdxjson $IMAGE ...
    - name: Attest SBOM to the image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
        echo "attested SBOM to ${image}@${DIGEST}"

  # Job 2: Build and Push Mock Redfish Image (parallel with build-and-push)
  build-and-push-mock-redfish:
    name: Build and Push Mock Redfish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/mock-redfish
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push mock-redfish image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.mock-redfish
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign mock-redfish image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

  # Job 3: Build and Push Mock Inspector Image (parallel with build-and-push and build-and-push-mock-redfish)
  build-and-push-mock-inspector:
    name: Build and Push Mock Inspector Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/mock-inspector
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push mock-inspector image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.mock-inspector
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        sbom: false

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    # Keyless (OIDC) signature bound to this workflow's identity. Verify with:
    #   cosign verify $IMAGE --certificate-identity-regexp \
    #     'https://github.com/{owner}/{repo}/.github/workflows/release.yml@refs/tags/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - name: Sign mock-inspector image (keyless)
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
        cosign sign --yes "${image}@${DIGEST}"
        echo "signed ${image}@${DIGEST}"

  # Job 4: Security Scan Released Images
  #
  # Every image this release publishes, not just the manager. mock-redfish and
  # mock-inspector are pushed by the jobs above and were never scanned, which is
  # how they came to ship a stale Go builder while the manager image was clean.
  # OSV-Scanner takes one image per archive, so this is a matrix.
  security-scan:
    name: Security Scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-mock-redfish, build-and-push-mock-inspector]
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: manager
            repo: manager
          - name: mock-redfish
            repo: mock-redfish
          - name: mock-inspector
            repo: mock-inspector
    steps:
    # The scanner runs as a container action with no access to the Docker
    # daemon, so the released image is pulled and handed over as an archive.
    - name: Pull and export ${{ matrix.image.name }}
      run: |
        image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.repo }}:${{ github.ref_name }}"
        docker pull "${image}"
        docker save -o osv-image.tar "${image}"
        echo "IMAGE_REF=${image}" >> "$GITHUB_ENV"

    - name: Scan ${{ matrix.image.name }} with OSV-Scanner
      uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
      continue-on-error: true # exits 1 on findings; the report is the deliverable
      with:
        scan-args: |-
          scan
          image
          --archive
          osv-image.tar
          --format=json
          --output=osv-image-results.json

    - name: Convert the ${{ matrix.image.name }} scan to SARIF
      uses: google/osv-scanner-action/osv-reporter-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
      with:
        scan-args: |-
          --new=osv-image-results.json
          --output=osv-image-results.sarif
          --gh-annotations=false
          --fail-on-vuln=false

    - name: Upload the ${{ matrix.image.name }} scan to the Security tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: osv-image-results.sarif
        category: osv-scanner-release-${{ matrix.image.name }}

    - name: Write the human-readable ${{ matrix.image.name }} report
      uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
      continue-on-error: true
      with:
        scan-args: |-
          scan
          image
          --archive
          osv-image.tar
          --format=table
          --output=report-body.txt

    - name: Label the report with the image it covers
      run: |
        {
          echo "=== ${IMAGE_REF} ==="
          cat report-body.txt 2>/dev/null || echo "(scan produced no output)"
          echo
        } > "osv-scanner-report-${{ matrix.image.name }}.txt"

    - name: Upload the ${{ matrix.image.name }} vulnerability report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vulnerability-report-${{ matrix.image.name }}
        path: osv-scanner-report-${{ matrix.image.name }}.txt

  # Job 5: Generate Release Artifacts
  generate-artifacts:
    name: Generate Release Artifacts  
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        
    - name: Install dependencies
      run: |
        go mod download
        make install-controller-gen
        
    - name: Install kustomize
      # Pinned via `go install` because the upstream `install_kustomize.sh`
      # at kustomize-master changed its asset-glob and started failing with
      # `tar: ./kustomize_v*_linux_amd64.tar.gz: Cannot open: No such file
      # or directory` (broke v0.4.0-alpha.5 release). Pinning here matches
      # the Go-install pattern already used for controller-gen and
      # golangci-lint in the Makefile, removes the dependency on a remote
      # shell script, and locks the version for reproducible release
      # manifests. Bump the version to track upstream when needed.
      run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3
        
    - name: Generate release manifests
      run: |
        export VERSION=${{ github.ref_name }}
        echo "Generating manifests for version: $VERSION"
        make release-manifests
        
    - name: Verify manifest generation
      run: |
        VERSION=${{ github.ref_name }}
        for f in "beskar7-manifests-$VERSION.yaml" infrastructure-components.yaml metadata.yaml; do
          if [ ! -f "$f" ]; then
            echo "❌ Release asset missing: $f"
            exit 1
          fi
        done
        # The kubectl manifest must have every clusterctl variable resolved; the
        # clusterctl components keep them (clusterctl init resolves them).
        if grep -q '\${' "beskar7-manifests-$VERSION.yaml"; then
          echo "❌ Unresolved clusterctl variables in the kubectl manifest:"
          grep '\${' "beskar7-manifests-$VERSION.yaml"
          exit 1
        fi
        echo "✅ Manifest file generated successfully: beskar7-manifests-$VERSION.yaml"
        echo "File size: $(stat -c%s "beskar7-manifests-$VERSION.yaml") bytes"
        echo "Checking for version placeholders..."
        if grep -q '${VERSION}' "beskar7-manifests-$VERSION.yaml"; then
          echo "❌ Found unresolved version placeholders in manifest:"
          grep '${VERSION}' "beskar7-manifests-$VERSION.yaml"
          exit 1
        fi
        echo "✅ No version placeholders found"
        
    - name: Generate checksums
      run: |
        sha256sum beskar7-manifests-${{ github.ref_name }}.yaml infrastructure-components.yaml metadata.yaml > checksums.txt
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-artifacts
        path: |
          beskar7-manifests-${{ github.ref_name }}.yaml
          infrastructure-components.yaml
          metadata.yaml
          checksums.txt

  # Job 4: Create Helm Chart (TODO: Implement Helm chart)
  # helm-chart:
  #   name: Create and Publish Helm Chart
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Checkout repository
  #     uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     
  #   - name: Install Helm
  #     uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
  #     with:
  #       version: '3.12.0'
  #       
  #   - name: Update chart version
  #     run: |
  #       VERSION=${{ github.ref_name }}
  #       # Remove 'v' prefix for Helm version
  #       CHART_VERSION=${VERSION#v}
  #       sed -i "s/^version:.*/version: $CHART_VERSION/" charts/beskar7/Chart.yaml
  #       sed -i "s/^appVersion:.*/appVersion: $VERSION/" charts/beskar7/Chart.yaml
  #       
  #   - name: Package Helm chart
  #     run: |
  #       helm package charts/beskar7 --destination ./charts/
  #       
  #   - name: Upload Helm chart
  #     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
  #     with:
  #       name: helm-chart
  #       path: charts/*.tgz

  # Job 6: Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, generate-artifacts]
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      
    - name: Combine the per-image vulnerability reports into the release asset
      run: |
        : > osv-scanner-report.txt
        for f in vulnerability-report-*/osv-scanner-report-*.txt; do
          [ -f "$f" ] && cat "$f" >> osv-scanner-report.txt
        done
        wc -l osv-scanner-report.txt

    - name: Generate release notes
      id: release-notes
      run: |
        # Extract version from tag
        VERSION=${{ github.ref_name }}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        # Helm chart versions carry no leading v (see helm-publish.yml)
        CHART_VERSION="${VERSION#v}"
        
        # Start with the header
        echo "# Beskar7 $VERSION" > release-notes.md
        echo "" >> release-notes.md
        
        # Extract release notes from CHANGELOG.md if available
        if [ -f CHANGELOG.md ]; then
          echo "Extracting release notes from CHANGELOG.md for $VERSION"
          # Extract release notes for this version from CHANGELOG
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > changelog-section.md
          if [ -s changelog-section.md ]; then
            echo "Found changelog entry for $VERSION"
            # Add the changelog content (skip the version header line)
            tail -n +2 changelog-section.md >> release-notes.md
          else
            echo "No changelog entry found for $VERSION, using generic content"
            echo "## 🚀 What's New" >> release-notes.md
            echo "" >> release-notes.md
            echo "This release includes improvements and bug fixes for the Beskar7 Kubernetes operator." >> release-notes.md
          fi
        else
          echo "CHANGELOG.md not found, using generic content"
          echo "## 🚀 What's New" >> release-notes.md
          echo "" >> release-notes.md
          echo "This release includes improvements and bug fixes for the Beskar7 Kubernetes operator." >> release-notes.md
        fi
        
        # Add common installation and info sections
        echo "" >> release-notes.md
        echo "## 📦 Installation" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using clusterctl" >> release-notes.md
        echo "Add the provider to \`~/.cluster-api/clusterctl.yaml\` (until beskar7 is in clusterctl's built-in list):" >> release-notes.md
        echo "\`\`\`yaml" >> release-notes.md
        echo "providers:" >> release-notes.md
        echo "  - name: beskar7" >> release-notes.md
        echo "    type: InfrastructureProvider" >> release-notes.md
        echo "    url: ${{ github.server_url }}/${{ github.repository }}/releases/latest/infrastructure-components.yaml" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "clusterctl init --infrastructure beskar7:$VERSION" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using Kubectl" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "kubectl apply -f ${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/beskar7-manifests-$VERSION.yaml" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Using Helm" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "helm repo add beskar7 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> release-notes.md
        echo "helm repo update" >> release-notes.md
        echo "helm install beskar7 beskar7/beskar7 --version $CHART_VERSION --namespace capb7-system --create-namespace" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "## 📋 Prerequisites" >> release-notes.md
        echo "" >> release-notes.md
        # Link to the docs at this tag rather than repeating minimum versions here, where they go stale.
        echo "Kubernetes, Cluster API, cert-manager, iPXE boot infrastructure and the \`beskar7-inspector\` image. The [installation guide](${{ github.server_url }}/${{ github.repository }}/blob/$VERSION/docs/installation.md#prerequisites) lists the versions this release requires." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🔒 Security" >> release-notes.md
        echo "" >> release-notes.md
        echo "This release includes security scanning and vulnerability assessment. See the attached vulnerability report for details." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🐳 Container Images" >> release-notes.md
        echo "" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> release-notes.md
        echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/mock-redfish:$VERSION" >> release-notes.md
        echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/mock-inspector:$VERSION" >> release-notes.md
        echo "\`\`\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "\`mock-redfish\` and \`mock-inspector\` are test doubles for the smoke tests and are not part of a production install." >> release-notes.md
        echo "" >> release-notes.md
        echo "Available for:" >> release-notes.md
        echo "- linux/amd64" >> release-notes.md
        echo "" >> release-notes.md
        echo "> **Note**: ARM64 support temporarily disabled for releases due to build timeout issues. Will be re-enabled in a future release." >> release-notes.md
        echo "" >> release-notes.md
        echo "## 🔐 Verification" >> release-notes.md
        echo "" >> release-notes.md
        echo "All three container images are signed with keyless cosign. The manager image also carries a signed SPDX SBOM attestation, and the same SBOM is attached to this release as \`sbom.spdx.json\`. The manifests and metadata are not signed: \`checksums.txt\` lists their SHA-256 sums." >> release-notes.md
        
    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        name: Beskar7 ${{ github.ref_name }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          release-artifacts/beskar7-manifests-${{ github.ref_name }}.yaml
          release-artifacts/infrastructure-components.yaml
          release-artifacts/metadata.yaml
          release-artifacts/checksums.txt
          sbom/sbom.spdx.json
          osv-scanner-report.txt
        token: ${{ secrets.GITHUB_TOKEN }}

  # Job 8: Notify on Success/Failure
  notify:
    name: Notify Release Status
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, generate-artifacts, release]
    if: always()
    permissions: {}
    steps:
    - name: Notify success
      if: ${{ needs.release.result == 'success' }}
      run: |
        echo "✅ Release ${{ github.ref_name }} created successfully!"
        echo "🐳 Container image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
        echo "Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        
    - name: Notify failure
      if: ${{ needs.release.result == 'failure' }}
      run: |
        echo "❌ Release ${{ github.ref_name }} failed!"
        echo "Please check the workflow logs for details."
        exit 1 